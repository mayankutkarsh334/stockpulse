services:

  # ──────────────────────────────────────────────
  # MySQL 8
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: stock_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: market_service
      MYSQL_USER: market_user
      MYSQL_PASSWORD: market_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Aerospike CE 7
  # ──────────────────────────────────────────────
  aerospike:
    image: aerospike/aerospike-server:7.1.0.4
    container_name: stock_aerospike
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - aerospike_data:/opt/aerospike/data
      - ./aerospike.conf:/etc/aerospike/aerospike.conf
    command: ["--config-file", "/etc/aerospike/aerospike.conf"]
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v status 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ──────────────────────────────────────────────
  # Zookeeper (required by Kafka)
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: stock_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────────
  # Kafka
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: stock_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────
  # Kafka topic initializer (creates topics on startup)
  # ──────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: stock_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic stock-price-alerts --partitions 6 --replication-factor 1 \
        --config retention.ms=3600000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic analysis-jobs --partitions 3 --replication-factor 1 \
        --config retention.ms=21600000
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"

  # ──────────────────────────────────────────────
  # RabbitMQ with Management UI
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: stock_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Python ML Forecast Service
  # ──────────────────────────────────────────────
  ml-service:
    build: ./ml-service
    container_name: stock_ml_service
    restart: unless-stopped
    ports:
      - "8082:8081"   # host 8082 → container 8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  aerospike_data:
  rabbitmq_data:
