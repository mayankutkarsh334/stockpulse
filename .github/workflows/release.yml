name: Release Snapshot

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure git bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          TAG="v${VERSION%-SNAPSHOT}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build artifact
        run: mvn package -DskipTests

      - name: Merge develop → master
        run: |
          git fetch origin master
          git checkout master
          git merge develop --no-ff -m "chore: release ${{ steps.version.outputs.current }} [skip ci]"
          git push origin master

      - name: Tag release on master
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.current }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.current }}"
          prerelease: true
          body: |
            Automated snapshot release from `develop` branch.
            **Version:** `${{ steps.version.outputs.current }}`
          files: target/stock-investing-service-*.jar

      - name: Bump patch version on develop
        run: |
          git checkout develop
          CURRENT="${{ steps.version.outputs.current }}"
          BASE="${CURRENT%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin develop
